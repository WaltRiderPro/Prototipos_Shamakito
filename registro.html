<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta — Shamakito | Arte y diversión en madera</title>
    <meta
      name="description"
      content="Crea tu cuenta en Shamakito para acompañar el desarrollo Montessori de tus hijos."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-page-body">
    <main class="login-split-container">
      <!-- Left Column: Brand & Display Title -->
      <div class="login-brand-col">
        <a href="index.html" class="login-logo">
          <img
            src="assets/img/logo.png"
            alt="Shamakito — Arte y diversión en madera"
          />
        </a>
        <h2 class="login-display-title">
          Aprende.<br />
          Juega.<br />
          crece.
        </h2>
        <p class="login-brand-sub">
          Únete a más de 12,000 familias que eligen madera certificada y
          aprendizaje con propósito Montessori.
        </p>
      </div>

      <!-- Right Column: Registration Form -->
      <div class="login-form-col">
        <div class="login-form-header">
          <h1>¡Bienvenido!</h1>
          <p>Crea tu cuenta para empezar a explorar y jugar.</p>
        </div>

        <form
          class="login-form"
          action="perfil.html"
          method="get"
          onsubmit="
            navigateWithTransition('perfil.html');
            return false;
          "
        >
          <div class="form-group">
            <label for="regName">Nombre completo</label>
            <input
              type="text"
              id="regName"
              class="login-input"
              value="Fabricio Cabrera Medina"
              placeholder="Tu nombre y apellido"
              required
            />
          </div>

          <div class="form-group">
            <label for="regEmail">Correo electronico</label>
            <input
              type="email"
              id="regEmail"
              class="login-input"
              value="fabricio@shamakito.pe"
              placeholder="nombre@correo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="regPassword">Contraseña</label>
            <input
              type="password"
              id="regPassword"
              class="login-input"
              value="***********"
              placeholder="Mínimo 8 caracteres"
              required
            />
          </div>

          <button type="submit" class="login-submit-btn">
            Crear mi cuenta
          </button>

          <p class="register-prompt">
            ¿Ya tienes una cuenta? <a href="login.html">Iniciar sesion</a>
          </p>
          <p class="register-prompt" style="margin-top: 2px">
            <a href="index.html">← Volver al inicio</a>
          </p>
        </form>
      </div>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
