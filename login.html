<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión — Shamakito | Arte y diversión en madera</title>
    <meta
      name="description"
      content="Ingresa a tu cuenta de Shamakito para seguir aprendiendo y jugando."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-page-body">
    <main class="login-split-container">
      <!-- Left Column: Brand & Display Title (Desktop Split / Top Logo on Tablet & Mobile) -->
      <div class="login-brand-col">
        <a href="index.html" class="login-logo">
          <img
            src="assets/img/logo.png"
            alt="Shamakito — Arte y diversión en madera"
          />
        </a>
        <h2 class="login-display-title">
          Aprende.<br />
          Juega.<br />
          crece.
        </h2>
        <p class="login-brand-sub">
          La tienda Montessori más completa para acompañar el desarrollo de tus
          hijos con amor y propósito.
        </p>
      </div>

      <!-- Right Column: Login Form -->
      <div class="login-form-col">
        <div class="login-form-header">
          <h1>¡Hola denuevo!</h1>
          <p>Ingresa para seguir aprendiendo y jugando.</p>
        </div>

        <form
          class="login-form"
          action="perfil.html"
          method="get"
          onsubmit="
            navigateWithTransition('perfil.html');
            return false;
          "
        >
          <div class="form-group">
            <label for="loginEmail">Correo electronico</label>
            <input
              type="email"
              id="loginEmail"
              class="login-input"
              value="TuCorreo@gmai.com"
              placeholder="TuCorreo@gmai.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Contraseña</label>
            <input
              type="password"
              id="loginPassword"
              class="login-input"
              value="***********"
              placeholder="***********"
              required
            />
          </div>

          <a href="configuracion.html" class="forgot-link"
            >¿Olvidaste las contraseña?</a
          >

          <button type="submit" class="login-submit-btn">Iniciar sesion</button>

          <p class="register-prompt">
            ¿No tienes cuenta?
            <a href="registro.html">Crear una nueva cuenta</a>
          </p>
        </form>
      </div>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
